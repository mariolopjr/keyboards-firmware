[package]
name = "agar"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RMK firmware for the YDKB Agar keyboard"

[features]
default = []
# logs sense-line edges and dropout lengths over the USB console. rmk installs
# the logger from `UsbTransport::run`. Nothing is emitted until the transport
# runs
matrix-instrument = ["dep:log", "rmk/usb_log"]

[dependencies]
# local fork branch mariolopjr/add-stm32-clock-tree
rmk = { path = "../../rmk/rmk", default-features = false }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
# `set-vtor`: the bootloader jumps to 0x08004000 without moving the vector table
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
# the matrix busy-waits a few microseconds per position. 32_768 Hz rounds each
# wait up to the next ~30us tick or 2.2ms across all 72
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
# `memory-x` is excluded: its layout starts at 0x08000000, where the
# bootloader lives
embassy-stm32 = { version = "0.6", features = [
    "stm32f103cb",
    "exti",
    "time-driver-any",
] }
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }
panic-halt = "1"
embedded-hal = "1.0"
log = { version = "0.4", optional = true }

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = "unwind"

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
