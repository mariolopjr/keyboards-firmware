[keyboard]
name = "m75h"
product_name = "m75h"
manufacturer = "Mode"
vendor_id = 0x00DE
product_id = 0x7572
chip = "stm32f401rc"

[matrix]
# COL2ROW: row_pins are read, col_pins are driven
row_pins = ["PC5", "PB0", "PB14", "PB15", "PA8", "PC9", "PA15"]
col_pins = ["PC8", "PC7", "PA10", "PB13", "PB12", "PB10", "PB1", "PC10", "PC11", "PD2", "PC12", "PB3", "PB4", "PB5", "PB8", "PB9"]

[aliases]
CtlEsc = "MT(Escape, LCtrl, nav)"
Boot = "Bootloader"
Bspc = "Backspace"
LBrc = "LeftBracket"
RBrc = "RightBracket"
Bsls = "Backslash"
Scln = "Semicolon"
PgDn = "PageDown"
Mute = "AudioMute"
VolUp = "AudioVolUp"
VolDn = "AudioVolDown"
Play = "MediaPlayPause"
Prev = "MediaPrevTrack"
Next = "MediaNextTrack"

[layout]
rows = 7
cols = 16
map = """
(0,0)  (0,1)  (0,2)  (0,3)  (0,4)  [1]  (0,6)  (0,7)  (0,8)  (0,9)  (0,10)  (0,11)  (0,12)  (0,13)  [1]  (0,15)
(1,0)  (1,1)  (1,2)  (1,3)  (1,4)  (1,5)  (1,6)  (1,7)  (1,8)  (1,9)  (1,10)  (1,11)  (1,12)  (1,13,@2u)  (1,15)
(2,0,@1.5u)  (2,1)  (2,2)  (2,3)  (2,4)  (2,5)  (2,6)  (2,7)  (2,8)  (2,9)  (2,10)  (2,11)  (2,12)  (2,14,@1.5u)  (2,15)
(3,0,@1.75u)  (3,1)  (3,2)  (3,3)  (3,4)  (3,5)  (3,6)  (3,7)  (3,8)  (3,9)  (3,10)  (3,11)  (3,14,@2.25u)  (3,15)
(4,0,@2.25u)  (4,2)  (4,3)  (4,4)  (4,5)  (4,6)  (4,7)  (4,8)  (4,9)  (4,10)  (4,11)  (4,12,@1.75u)  (4,14)  (4,15)
(5,0,@1.5u)  (5,1,@1.5u)  (5,2,@1.5u)  (6,6,@7u)  (6,11,@1.5u)  (6,13)  (6,14)  (6,15)
"""

[keymap]
layers = 2

[[keymap.layer]]
name = "base"
keys = """
Escape   F1    F2    F3     F4     F5     F6    F7     F8     F9   F10    F11     F12    F13
Grave    Kc1   Kc2   Kc3    Kc4    Kc5    Kc6   Kc7    Kc8    Kc9  Kc0    Minus   Equal  @Bspc   Delete
Tab      Q     W     E      R      T      Y     U      I      O    P      @LBrc   @RBrc  @Bsls   PageUp
@CtlEsc  A     S     D      F      G      H     J      K      L    @Scln  Quote   Enter  @PgDn
LShift   Z     X     C      V      B      N     M      Comma  Dot  Slash  RShift  Up     End
LCtrl    LAlt  LGui  Space  MO(1)  Left   Down  Right
"""

[[keymap.layer]]
name = "fn"
keys = """
@Boot    _     _     _      _      _      _     _      _      _    _      _       _      _
_        _     _     _      _      _      _     _      _      _    _      _       _      _       @Mute
_        _     _     _      _      _      _     _      _      _    _      _       _      _       @VolUp
_        _     _     _      _      _      _     _      _      _    _      _       _      @VolDn
_        _     _     _      _      _      _     _      _      _    _      _       _      @Play
_        _     _     _      _      @Prev  _     @Next
"""

[behavior.morse]
enable_flow_tap = true
prior_idle_time = "100ms"

[behavior.morse.profiles.nav]
# any other key pressed while Caps is held resolves it to Ctrl immediately
hold_on_other_press = true
# holding Caps this long resolves to Ctrl
hold_timeout = "150ms"

[rmk]
debounce_time = 5

[storage]
enabled = false

[dependency]
defmt_log = false

[host]
vial_enabled = false

# 8 MHz HSE crystal -> 84 MHz sysclk, 48 MHz USB
# GENERIC_STM32_F401XC defaults produce (PLLM=4, PLLN=168, PLLP=4, PLLQ=7)
[chip.stm32f401rc]
hse_mhz = 8
